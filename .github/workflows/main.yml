name: Deploy to Google VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/metal/saasrusakparah
            git pull origin main
            cd backend
            npm ci --omit=dev
            node -e "require('dotenv').config(); if (!process.env.JWT_SECRET || Buffer.byteLength(process.env.JWT_SECRET, 'utf8') < 32) { console.error('JWT_SECRET is missing or shorter than 32 bytes in backend/.env'); process.exit(1); } console.log('JWT_SECRET configuration is valid');"
            pm2 restart saasrusakparah --update-env
